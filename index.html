<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parallax mit Kästen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="content-wrapper">
    <h1>Dein Inhalt oben</h1>
    <p>Scroll runter, um die Kästen zu sehen.</p>
  </div>

  <div class="boxes-container" id="boxes">
    <div class="box">
      <img src="Bild1.png" alt="Bild 1" />
      <div class="box-text">Youtube</div>
    </div>
    <div class="box">
      <img src="Bild2.png" alt="Bild 2" />
      <div class="box-text">video</div>
    </div>
    <div class="box">
      <img src="Bild3.png" alt="Bild 3" />
      <div class="box-text">Autos</div>
    </div>
    <div class="box">
      <img src="Bild4.png" alt="Bild 4" />
      <div class="box-text">Über mich</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
